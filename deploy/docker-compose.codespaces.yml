# GitHub Codespaces workaround: default bridge blocks container-to-container TCP.
# Use with: docker compose -f docker-compose.staging.yml -f docker-compose.codespaces.yml
# Postgres stays on the bridge with loopback publish; app services use host networking.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    network_mode: host
    environment:
      DATABASE_URL: postgresql://diamond:${POSTGRES_PASSWORD}@127.0.0.1:5432/diamond_staging

  backend:
    network_mode: host
    environment:
      DATABASE_URL: postgresql://diamond:${POSTGRES_PASSWORD}@127.0.0.1:5432/diamond_staging
      PASSPORT_NUMBER_API_URL: http://127.0.0.1:8010
      UAE_DRIVING_LICENSE_API_URL: http://127.0.0.1:8020
      PASSPORT_NUMBER_API_ORCHESTRATE: "false"
      UAE_DRIVING_LICENSE_API_ORCHESTRATE: "false"

  frontend:
    network_mode: host
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
